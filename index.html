<title>Money</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8e8e93; --line:#e5e5ea;
  --accent:#0a84ff; --income:#30a46c; --expense:#e5484d; --saving:#8e4ec6;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#8e8e93; --line:#2c2c2e; --accent:#0a84ff; --income:#3dd68c; --expense:#ff6369; --saving:#bf7af0; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
main{max-width:640px;margin:0 auto;padding:8px 16px 24px}
h1{font-size:30px;margin:12px 0 4px;letter-spacing:-.02em}
.eyebrow{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.income{color:var(--income)} .expense{color:var(--expense)} .saving{color:var(--saving)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}
.grid3 .v{font-weight:650;font-size:16px;white-space:nowrap}
.grid3 .l{font-size:12px;color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.btn{background:var(--accent);color:#fff;padding:13px 16px;border-radius:12px;font-weight:600;width:100%}
.btn.sec{background:var(--bg);color:var(--accent)}
.btn.danger{background:var(--bg);color:var(--expense)}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(10,132,255,.4);display:grid;place-items:center;z-index:6}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.monthbar strong{font-size:17px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--bg)}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:650;white-space:nowrap}
.day{font-size:13px;color:var(--muted);margin:16px 4px 0}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.catrow{margin:12px 0}
.catrow .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.goal{display:flex;gap:12px;align-items:stretch}
.goal .img{width:84px;height:84px;border-radius:12px;background:var(--bg);flex:none;object-fit:cover;display:grid;place-items:center;font-size:30px;overflow:hidden}
.goal .img img{width:100%;height:100%;object-fit:cover}
.goal .body{flex:1;min-width:0}
.goal .name{font-weight:650}
.goal .num{font-size:13px;color:var(--muted);margin:2px 0 8px}
.goal .ctl{display:flex;flex-direction:column;gap:6px}
.next{font-size:12px;color:var(--accent);font-weight:600}
.done{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:0;border-radius:12px;padding:12px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:46px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.actions{display:flex;gap:8px;margin-top:16px}
.hidden{display:none}
.golink{display:inline-block;margin-top:12px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.gtabs{display:flex;gap:20px;overflow-x:auto;white-space:nowrap;margin:14px 4px 0;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.gtabs button{flex:none;color:var(--muted);font-weight:600;padding:6px 0;border-bottom:2px solid transparent}
.gtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.lsec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 0}
.garden{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.plant{background:var(--bg);border-radius:14px;padding:10px 8px 12px;text-align:center;cursor:pointer}
.plant svg{display:block;margin:0 auto}
.plant .pn{font-weight:650;font-size:14px;margin-top:4px}
.plant .pa{font-size:12px;color:var(--muted)}
.plant .bar{margin:8px 10px 0}
.potcard{cursor:pointer}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:40;display:none;align-items:center;gap:12px;justify-content:space-between;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast button{font-size:22px;line-height:1;color:inherit;padding:0 4px}
[data-sort]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[data-sort] img{-webkit-user-drag:none;pointer-events:none}
.sorting{transition:transform .16s ease}
.dragging{position:relative;z-index:8;box-shadow:0 14px 30px rgba(0,0,0,.28);transition:box-shadow .15s}
.tx.planned .t,.tx.planned .a,.tx.planned .dot{opacity:.6}
.tx.planned .s{font-style:italic}
.mrow{display:grid;grid-template-columns:.9fr 1.1fr 1.1fr 1.1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.mrow:last-child{border-bottom:0}
.mhead{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.frow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.lrow{display:grid;grid-template-columns:1fr 36px 36px 36px;gap:8px;margin-bottom:8px;align-items:center}
.splitrow{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:8px;align-items:center}
svg text{fill:var(--muted);font:11px -apple-system,system-ui,sans-serif}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav id="nav">
  <button data-tab="overview"><span class="ic">◉</span>Overview</button>
  <button data-tab="tx"><span class="ic">≡</span>Transactions</button>
  <button data-tab="goals"><span class="ic">★</span>Wishlist</button>
  <button data-tab="savings"><span class="ic">✿</span>Savings</button>
  <button data-tab="more"><span class="ic">⋯</span>More</button>
</nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
"use strict";
var KEY="money_tracker_v1";
var CATS={
  expense:[["🛒","Groceries"],["🧴","Household"],["💊","Health"],["🍽️","Eating out"],["🎬","Entertainment"],["🚌","Transport"],["🏠","Rent & bills"],["🛍️","Shopping"],["📦","Other"]],
  income:[["💼","Salary"],["💸","Other income"]],
  saving:[["🐖","Savings"]]
};
var ICON={};
Object.keys(CATS).forEach(function(k){CATS[k].forEach(function(c){ICON[c[1]]=c[0];});});

var state={tx:[],goals:[],lists:[]};
var ui={tab:"overview",month:ym(new Date()),catFilter:null,gl:"all",pot:null,noClick:0};

// Storage: IndexedDB (hundreds of MB, survives reloads) with the old localStorage copy as the fallback and the migration source.
var idbRef=null,writeChain=Promise.resolve(),lastToast=0;
function idbOpen(){return new Promise(function(res,rej){try{var r=indexedDB.open("money_tracker_db",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.onblocked=function(){rej(new Error("blocked"));};}catch(e){rej(e);}});}
function idbGet(db){return new Promise(function(res,rej){var q=db.transaction("kv").objectStore("kv").get(KEY);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
function idbSet(db,val){return new Promise(function(res,rej){var tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(val,KEY);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error);};});}
function toast(msg){
  if(Date.now()-lastToast<8000)return;lastToast=Date.now();
  var t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.innerHTML='<span></span><button aria-label="Close">×</button>';
  t.firstChild.textContent=msg;
  t.lastChild.onclick=function(){t.style.display="none";};
  t.style.display="flex";
  clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},12000);
}
function loadFrom(raw){
  try{var d=typeof raw==="string"?JSON.parse(raw):raw;if(d){state.tx=(d.tx||[]).map(function(t){if(t.cat==="Fun")t.cat="Entertainment";return t;});state.goals=d.goals||[];state.lists=d.lists||[];state.migr=d.migr;state.plan=!!d.plan;state.eurRate=d.eurRate>0?d.eurRate:undefined;}}catch(e){}
  var needs=(state.migr||0)<4&&(state.tx.length||state.goals.length||state.lists.length);
  normalize();if(needs)save();
}
function load(){
  var raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  loadFrom(raw);
}
function save(){
  if(idbRef){
    writeChain=writeChain.then(function(){return idbSet(idbRef,JSON.stringify(state));}).catch(function(){toast("Could not save your changes. Download a backup from More to be safe.");});
    return;
  }
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("Could not save: this browser's storage is full. Download a backup from More, then remove some photos.");}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?"0"+n:""+n;}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function huf(n){return Math.round(n).toLocaleString("hu-HU").replace(/\u00a0/g," ")+" Ft";}
function num(v){return Number.parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));}
function eur(n){return (Math.round(n*100)/100).toLocaleString("hu-HU",{maximumFractionDigits:2}).replace(/\u00a0/g," ")+" €";}
function isEurId(id){var l=state.lists.filter(function(x){return x.id===id;})[0];return !!(l&&l.cur==="EUR");}
function fmtP(l,n){return l&&l.cur==="EUR"?eur(n):huf(n);}
function toHuf(l,n){return l&&l.cur==="EUR"?n*(state.eurRate||0):n;}
function eurPot(){return state.lists.filter(function(l){return l.pot&&l.cur==="EUR";})[0];}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function monthLabel(m){var p=m.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});}
function shiftMonth(m,d){var p=m.split("-");return ym(new Date(+p[0],+p[1]-1+d,1));}
function dayLabel(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}

/* ---------- calculations ---------- */
function sums(list){
  var r={income:0,expense:0,saving:0};
  list.forEach(function(t){r[t.type]+=t.amount;});
  return r;
}
function txIn(m){return state.tx.filter(function(t){return t.date.slice(0,7)===m;});}
// Planning: anything dated after today is "planned". It stays out of the current numbers until that day arrives,
// unless "Including planned" is switched on (Savings / Wishlist) or you look at a future month (which is all plan).
function isPlanned(t){return t.date>today();}
function curMonth(){return today().slice(0,7);}
function counts(t){return !!state.plan||!isPlanned(t);}
function hasPlanned(){return state.tx.some(isPlanned);}
function monthTx(m){return txIn(m).filter(function(t){return m>curMonth()||!isPlanned(t);});}
function planToggle(){
  if(!hasPlanned())return '';
  return '<div style="margin:2px 4px 10px"><button class="golink" style="margin:0" data-act="plantoggle">Including planned: '+(state.plan?"On":"Off")+' ›</button><div class="muted" style="font-size:12px;margin-top:2px">'+(state.plan?"Showing balances as they will be once all planned entries have happened.":"Planned entries (dated after today) don\'t count yet.")+'</div></div>';
}
// A receipt can be split across categories; every transaction reads as a list of category lines.
function lines(t){return t.splits&&t.splits.length?t.splits:[{cat:t.cat,amount:t.amount}];}
// Wishlist lists (Move-in, First shopping, Furniture, ...). Every item belongs to one list.
function normalize(){
  if(!Array.isArray(state.lists)||!state.lists.length){
    state.lists=[{id:"l_move",name:"Move-in"},{id:"l_house",name:"Move-in household items"},{id:"l_furn",name:"Furniture"},{id:"l_wish",name:"Shopping wishlist"}];
    state.migr=2;
  }
  // one-time cleanup of the first starter lists: "First shopping" and the old catch-all go into "Move-in"
  if((state.migr||0)<2){
    if(state.lists.some(function(l){return l.id==="l_move";})){
      state.goals.forEach(function(g){if(g.listId==="l_first"||g.listId==="l_wish")g.listId="l_move";});
      state.tx.forEach(function(t){if(t.listId==="l_first")t.listId="l_move";});
      state.lists=state.lists.filter(function(l){return l.id!=="l_first";});
      if(!state.lists.some(function(l){return l.id==="l_house";})){
        var mi=state.lists.findIndex(function(l){return l.id==="l_move";});
        state.lists.splice(mi+1,0,{id:"l_house",name:"Move-in household items"});
      }
    }
    state.migr=2;
  }
  // savings pots: plain money pots with no items (presents, health, travel, ...)
  if((state.migr||0)<3){
    if(!state.lists.some(function(l){return l.pot;})){
      [["p_moving","Moving"],["p_presents","Presents"],["p_health","Health"],["p_travel","Travel & leisure"],["p_clothing","Clothing & shopping"],["p_revolut","Revolut"],["p_misc","Miscellaneous"]].forEach(function(x){state.lists.push({id:x[0],name:x[1],pot:true});});
    }
    state.migr=3;
  }
  if((state.migr||0)<4){
    if(!state.lists.some(function(l){return l.pot&&(l.id==="p_moving"||l.name.toLowerCase()==="moving");})){
      var fp0=state.lists.findIndex(function(l){return l.pot;});
      var mv0={id:"p_moving",name:"Moving",pot:true};
      if(fp0<0)state.lists.push(mv0);else state.lists.splice(fp0,0,mv0);
    }
    state.migr=4;
  }
  var ids=state.lists.map(function(l){return l.id;}),wl=wishLists(),wids=wl.map(function(l){return l.id;}),fb=wl[wl.length-1].id;
  state.goals.forEach(function(g){if(wids.indexOf(g.listId)<0)g.listId=fb;});
  state.tx.forEach(function(t){if(t.listId&&ids.indexOf(t.listId)<0)delete t.listId;if(t.fromPot&&ids.indexOf(t.fromPot)<0)delete t.fromPot;});
  wl.forEach(function(l){if(l.pots)l.pots=l.pots.filter(function(id){return ids.indexOf(id)>=0;});});
}
function wishLists(){return state.lists.filter(function(l){return !l.pot;});}
function allPots(){return state.lists.filter(function(l){return l.pot;});}
function potLists(){return state.lists.filter(function(l){return l.pot&&!l.done;});}
function donePots(){return state.lists.filter(function(l){return l.pot&&l.done;});}
// plants offered in a dropdown: the active ones, plus a finished one if the entry being edited already uses it
function potsFor(sel){return allPots().filter(function(l){return !l.done||l.id===sel;});}
function listName(id){var l=state.lists.filter(function(x){return x.id===id;})[0];return l?l.name:"";}
function listByName(n){
  n=String(n||"").trim();if(!n)return null;
  var L=state.lists.filter(function(x){return !x.pot&&x.name.toLowerCase()===n.toLowerCase();})[0];
  if(!L){L={id:uid(),name:n.slice(0,40)};state.lists.push(L);}
  return L;
}

// Wishlist allocation: all money saved flows to items in priority order.
// Bought items consume their price from the pool. Remaining pool fills open items one by one.
// Savings can be set aside for a specific list, or left general. A list's own savings fill its items in order;
// general savings then flow through the lists from top to bottom. Bought items consume their price.
function allocate(){
  var wl=wishLists(),wid={},savedTo={},G=0,spent=0,totalSaved=0,potBal={},potRem={},potPaid=0;
  wl.forEach(function(l){wid[l.id]=1;});
  allPots().forEach(function(l){potBal[l.id]=0;});
  state.tx.forEach(function(t){
    if(!counts(t))return;
    if(t.type==="saving"){
      if(t.listId&&potBal[t.listId]!==undefined)potBal[t.listId]+=(isEurId(t.listId)?(t.eur||0):t.amount);
      else{totalSaved+=t.amount;if(t.listId&&wid[t.listId])savedTo[t.listId]=(savedTo[t.listId]||0)+t.amount;else G+=t.amount;}
    }else if(t.type==="expense"&&t.fromPot&&potBal[t.fromPot]!==undefined)potBal[t.fromPot]-=t.amount;
  });
  potLists().forEach(function(l){if(l.cur!=="EUR")potRem[l.id]=Math.max(0,potBal[l.id]);});
  var out={totalSaved:totalSaved,items:{},lists:{},pots:potBal};
  // each wishlist is funded by: money saved directly for it, then the savings pots linked to it, then general savings
  wl.forEach(function(l){
    var own=savedTo[l.id]||0,spL=0,linked=(l.pots||[]).filter(function(id){return potRem[id]!==undefined;});
    state.goals.forEach(function(g){if(g.listId===l.id&&g.done)spL+=(g.paid!=null?g.paid:g.price);});
    spent+=spL;
    var rem=own-spL;
    if(rem<0){
      var def=-rem;rem=0;
      linked.forEach(function(id){var t=Math.min(def,potRem[id]);potRem[id]-=t;potBal[id]-=t;potPaid+=t;def-=t;});
      if(def>0)G-=def;
    }
    var need=0,funded=0;
    state.goals.forEach(function(g){
      if(g.listId!==l.id)return;
      if(g.done){out.items[g.id]={funded:g.price,pct:100};return;}
      var f=Math.min(g.price,rem);rem-=f;
      linked.forEach(function(id){var t=Math.min(g.price-f,potRem[id]);if(t>0){potRem[id]-=t;f+=t;}});
      if(f<g.price){var x=Math.min(g.price-f,Math.max(0,G));G-=x;f+=x;}
      out.items[g.id]={funded:f,pct:g.price>0?Math.round(f/g.price*100):0};
      need+=g.price;funded+=f;
    });
    out.lists[l.id]={saved:own,need:need,funded:funded};
  });
  var allSaved=0,potExp=0;
  state.tx.forEach(function(t){if(!counts(t))return;if(t.type==="saving")allSaved+=t.amount;else if(t.type==="expense"&&t.fromPot&&potBal[t.fromPot]!==undefined)potExp+=t.amount;});
  out.balance=allSaved-spent-potExp;
  out.spent=spent;out.free=Math.max(0,totalSaved-(spent-potPaid));
  return out;
}

/* ---------- render ---------- */
var app=document.getElementById("app");
function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===ui.tab);});
  document.getElementById("fab").style.display=(ui.tab==="more")?"none":"grid";
  if(ui.tab==="overview")app.innerHTML=viewOverview();
  else if(ui.tab==="tx")app.innerHTML=viewTx();
  else if(ui.tab==="goals")app.innerHTML=viewGoals();
  else if(ui.tab==="savings")app.innerHTML=viewSavings();
  else app.innerHTML=viewMore();
}

function monthBar(){
  return '<div class="monthbar"><button class="iconbtn" data-act="prev">‹</button><strong>'+monthLabel(ui.month)+'</strong><button class="iconbtn" data-act="next">›</button></div>';
}

function viewOverview(){
  var list=monthTx(ui.month),s=sums(list),net=s.income-s.expense-s.saving;
  var isFuture=ui.month>curMonth(),fut=ui.month===curMonth()?txIn(ui.month).filter(isPlanned):[],fs=sums(fut),fnet=fs.income-fs.expense-fs.saving;
  var h='<div class="eyebrow">Overview</div><h1>Money</h1>'+monthBar();
  h+='<div class="card"><div class="muted" style="font-size:13px">'+(isFuture?"Planned left this month":"Left this month")+'</div><div class="big '+(net<0?"expense":"")+'">'+huf(net)+'</div>';
  h+='<div class="grid3" style="margin-top:14px"><div><div class="v income">'+huf(s.income)+'</div><div class="l">Income</div></div><div><div class="v expense">'+huf(s.expense)+'</div><div class="l">Spent</div></div><div><div class="v saving">'+huf(s.saving)+'</div><div class="l">Saved</div></div></div>';
  if(s.income>0){var rate=Math.round(s.saving/s.income*100);h+='<div class="muted" style="font-size:13px;margin-top:12px">Savings rate: <strong style="color:var(--text)">'+rate+'%</strong></div>';}
  h+='<div class="muted" style="font-size:13px;margin-top:8px">Saved so far, all months'+(state.plan?" (incl. planned)":"")+': <strong style="color:var(--text)">'+huf(allocate().balance)+'</strong></div>';
  h+='</div>';
  if(isFuture)h+='<div class="muted" style="font-size:13px;margin:-4px 4px 8px">This month is in the future, so everything in it is planned. It does not change your current numbers.</div>';
  if(fut.length){
    h+='<div class="card"><div class="eyebrow">Still planned this month</div><div class="grid3" style="margin-top:10px"><div><div class="v income">'+huf(fs.income)+'</div><div class="l">Income</div></div><div><div class="v expense">'+huf(fs.expense)+'</div><div class="l">Spending</div></div><div><div class="v saving">'+huf(fs.saving)+'</div><div class="l">Saving</div></div></div>';
    h+='<div class="row spread" style="margin-top:14px"><span class="muted" style="font-size:13px">Left at month end, if all of it happens</span><strong class="'+(net+fnet<0?"expense":"")+'">'+huf(net+fnet)+'</strong></div></div>';
  }

  // trend
  h+='<div class="card"><div class="eyebrow" style="margin-bottom:8px">Last 6 months</div>'+trendSvg()+'<div class="legend"><span><i style="background:var(--income)"></i>Income</span><span><i style="background:var(--expense)"></i>Spent</span><span><i style="background:var(--saving)"></i>Saved</span></div></div>';

  // categories
  var cats={};list.filter(function(t){return t.type==="expense";}).forEach(function(t){lines(t).forEach(function(l){cats[l.cat]=(cats[l.cat]||0)+l.amount;});});
  var keys=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
  h+='<div class="card"><div class="eyebrow">Spending by category</div>';
  if(!keys.length)h+='<div class="empty">No spending this month</div>';
  keys.forEach(function(k){
    var pct=s.expense?cats[k]/s.expense*100:0;
    h+='<div class="catrow" data-cat="'+esc(k)+'" style="cursor:pointer"><div class="top"><span>'+(ICON[k]||"📦")+' '+esc(k)+'</span><span><strong>'+huf(cats[k])+'</strong> <span class="muted">'+Math.round(pct)+'%</span></span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  });
  h+='</div>';

  var ap=allocate(),pl=potLists();
  if(pl.length){
    var ptot=0;pl.forEach(function(l){ptot+=toHuf(l,ap.pots[l.id]||0);});
    h+='<div class="card"><div class="row spread"><div class="eyebrow">Garden</div><strong>'+huf(ptot)+'</strong></div><div class="garden">';
    pl.forEach(function(l){
      var bal=ap.pots[l.id]||0,bud=l.budget||0,pr=bud>0?bal/bud:0;
      h+='<div class="plant" data-plant="'+l.id+'">'+plantSvg(pr,92)+'<div class="pn">'+esc(l.name)+'</div><div class="pa">'+(bud>0?fmtP(l,bal)+' / '+fmtP(l,bud):fmtP(l,bal)+' · set a budget')+'</div>';
      if(bud>0)h+='<div class="bar"><i style="width:'+Math.min(100,Math.max(0,pr*100))+'%;background:var(--income)"></i></div><div class="pa" style="margin-top:4px">'+(pr>=1?'In bloom 🌸':Math.floor(Math.min(0.99,Math.max(0,pr))*100)+'%')+'</div>';
      h+='</div>';
    });
    h+='</div><div class="muted" style="font-size:13px;margin-top:12px">Tap a plant to set its budget. Each plant grows as its balance reaches the budget and flowers when it gets there. Balance = saved into it minus expenses paid from it.</div></div>';
  }
  // wishlist teaser
  var a=allocate();
  var next=nextGoal();
  if(next){
    var it=a.items[next.id];
    h+='<div class="card"><div class="eyebrow">Next on your wishlist</div><div class="row spread" style="margin-top:6px"><strong>'+esc(next.name)+'</strong><span class="muted">'+huf(it.funded)+' / '+huf(next.price)+'</span></div><div class="bar" style="margin-top:8px"><i style="width:'+it.pct+'%;background:var(--saving)"></i></div><div class="muted" style="font-size:13px;margin-top:6px">'+huf(next.price-it.funded)+' still to save</div></div>';
  }
  return h;
}

function trendSvg(){

// "" = empty, null = invalid, otherwise a clean http(s) URL
function cleanUrl(u){
  u=String(u||"").trim();if(!u)return "";
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  try{var p=new URL(u);if((p.protocol!=="http:"&&p.protocol!=="https:")||p.hostname.indexOf(".")<0)return null;return p.href;}catch(e){return null;}
}

// A growing plant: the closer a pot's balance gets to its budget, the taller and leafier it grows. It flowers at 100%.
function plantSvg(p,w){
  p=Math.max(0,Math.min(1,p||0));
  var sh=14+64*p,top=100-sh,n=1+Math.round(p*5),i,out='';
  out+='<path d="M60 101 Q'+(60+(p>0.5?3:-2))+' '+(100-sh/2)+' 60 '+top.toFixed(1)+'" fill="none" stroke="#3b8f5a" stroke-width="3" stroke-linecap="round"/>';
  for(i=0;i<n;i++){
    var y=100-(i+1)*(sh/(n+0.6)),sz=6+p*5+(n-i)*0.9,left=(i%2===0),col=(i%2===0)?"#4cc27a":"#36a05f";
    var lx=(left?60-sz*0.95:60+sz*0.95).toFixed(1),ly=(y-(left?0:3)).toFixed(1),rot=left?-32:32;
    out+='<ellipse cx="'+lx+'" cy="'+ly+'" rx="'+sz.toFixed(1)+'" ry="'+(sz*0.5).toFixed(1)+'" transform="rotate('+rot+' '+lx+' '+ly+')" fill="'+col+'"/>';
    if(p>0.35&&i<n-1){
      var lx2=(left?60+sz*0.95:60-sz*0.95).toFixed(1),ly2=(y+4).toFixed(1);
      out+='<ellipse cx="'+lx2+'" cy="'+ly2+'" rx="'+(sz*0.85).toFixed(1)+'" ry="'+(sz*0.43).toFixed(1)+'" transform="rotate('+(-rot)+' '+lx2+' '+ly2+')" fill="'+(col==="#4cc27a"?"#36a05f":"#4cc27a")+'"/>';
    }
  }
  out+='<ellipse cx="60" cy="'+(top-3).toFixed(1)+'" rx="4" ry="'+(5+p*4).toFixed(1)+'" fill="#4cc27a"/>';
  var spots=[[60,top-8],[60-22,top+16],[60+22,top+10]];
  if(p>=1){
    var cols=["#f06292","#ff8a65","#ba68c8"];
    spots.forEach(function(sp,k){
      var k2;for(k2=0;k2<5;k2++){var a=(k2*72-90)*Math.PI/180;out+='<circle cx="'+(sp[0]+5.2*Math.cos(a)).toFixed(1)+'" cy="'+(sp[1]+5.2*Math.sin(a)).toFixed(1)+'" r="4.4" fill="'+cols[k]+'"/>';}
      out+='<circle cx="'+sp[0]+'" cy="'+sp[1].toFixed(1)+'" r="3.2" fill="#ffd54f"/>';
    });
  }else if(p>=0.8){
    spots.forEach(function(sp){out+='<circle cx="'+sp[0]+'" cy="'+sp[1].toFixed(1)+'" r="4" fill="#f8bbd0"/><path d="M'+(sp[0]-3.5)+' '+(sp[1]+3).toFixed(1)+'q3.5 4 7 0" fill="none" stroke="#3b8f5a" stroke-width="1.6" stroke-linecap="round"/>';});
  }
  var pot='<path d="M36 112h48l-5 24q-.5 2-2.5 2H43.5q-2 0-2.5-2z" fill="#c4704c"/><rect x="30" y="100" width="60" height="13" rx="4" fill="#d98660"/><ellipse cx="60" cy="100.5" rx="26" ry="3" fill="#5a3d2e"/>';
  var ww=w||92;
  return '<svg viewBox="0 0 120 140" width="'+ww+'" height="'+(ww*140/120).toFixed(0)+'" role="img" aria-label="Plant">'+pot+out+'</svg>';
}

function resizeImage(file,cb,onerr){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=480,sc=Math.min(1,max/Math.max(im.width,im.height));
      var c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.72));
    };
    im.onerror=function(){if(onerr)onerr();else alert("Could not read that image.");};
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

  if(b.id==="f_split"){
    readTxForm();

    else{
      var other=CATS.expense.map(function(c){return c[1];}).filter(function(n){return n!==draft.cat;})[0];
      draft.splits=[{cat:draft.cat,amount:""},{cat:other,amount:""}];
    }
    drawTxSheet();return;
  }
  if(b.id==="f_addline"){

    var rem=remainder().r;
    draft.splits.push({cat:free,amount:rem>0?rem:""});
    drawTxSheet();return;
  }
  if(b.dataset.srm!==undefined){
    readTxForm();
    draft.splits.splice(+b.dataset.srm,1);

  }
  if(b.id==="f_save"){
    readTxForm();

    if(!(amt>0)){alert("Enter an amount.");return;}
    if(!draft.date){alert("Pick a date.");return;}

      var merged=[];

      });

      if(Math.abs(sum-amt)>0.5){alert("The category lines add up to "+huf(sum)+", but the receipt total is "+huf(amt)+".");return;}
      if(merged.length>1){splits=merged;rcat=merged.slice().sort(function(a,b){return b.amount-a.amount;})[0].cat;}
      else if(merged.length===1){rcat=merged[0].cat;}
    }
    var rec={id:draft.id||uid(),type:draft.type,amount:amt,cat:rcat,date:draft.date,place:draft.place,note:draft.note};
    if(draft.type==="saving"&&isEurId(draft.listId)){
      var rt=num(draft.rate);
      if(!(rt>0)){alert("Enter the rate (Ft per 1 EUR).");return;}
      rec.eur=amt;rec.rate=rt;rec.amount=Math.round(amt*rt);state.eurRate=rt;
    }
    if(splits)rec.splits=splits;
    if(draft.type==="saving"&&draft.listId)rec.listId=draft.listId;
    if(draft.type==="expense"&&draft.fromPot)rec.fromPot=draft.fromPot;
    var idx=state.tx.findIndex(function(x){return x.id===rec.id;});
    if(idx>-1)state.tx[idx]=rec;else state.tx.push(rec);
    ui.month=rec.date.slice(0,7);
    save();closeSheet();render();return;
  }
  if(b.id==="f_del"){if(confirm("Delete this transaction?")){state.tx=state.tx.filter(function(x){return x.id!==draft.id;});save();closeSheet();render();}return;}
  if(b.dataset.lup!==undefined||b.dataset.ldown!==undefined){
    var li=+(b.dataset.lup!==undefined?b.dataset.lup:b.dataset.ldown),dir=b.dataset.lup!==undefined?-1:1,kind=!!state.lists[li].pot,lj=li;do{lj+=dir;}while(lj>=0&&lj<state.lists.length&&!!state.lists[lj].pot!==kind);
    if(lj>=0&&lj<state.lists.length){var lt=state.lists[li];state.lists[li]=state.lists[lj];state.lists[lj]=lt;save();listsSheet();}
    return;
  }
  if(b.dataset.ldel!==undefined){delList(+b.dataset.ldel);return;}
  if(b.dataset.ftog){var fi=fdraft.pots.indexOf(b.dataset.ftog);if(fi<0)fdraft.pots.push(b.dataset.ftog);else fdraft.pots.splice(fi,1);fundSheet(null);return;}
  if(b.id==="f_fsave"){var fl2=state.lists.filter(function(x){return x.id===fdraft.id;})[0];if(fl2){fl2.pots=fdraft.pots;save();}closeSheet();return;}
  if(b.id==="ne_save"){
    var en=document.getElementById("ne_name").value.trim(),er=num(document.getElementById("ne_rate").value);
    if(!en){alert("Give the plant a name.");return;}
    if(!(er>0)){alert("Enter the rate (Ft per 1 EUR).");return;}
    if(eurPot()){closeSheet();return;}
    var ne={id:uid(),name:en.slice(0,40),pot:true,cur:"EUR",budget:Math.max(0,num(document.getElementById("ne_budget").value)||0)};
    state.eurRate=er;state.lists.push(ne);save();closeSheet();ui.pot=ne.id;ui.tab="savings";render();window.scrollTo(0,0);return;
  }
  if(b.id==="np_save"){
    var nm=document.getElementById("np_name").value.trim();if(!nm){alert("Give the plant a name.");return;}
    var nb=Math.max(0,num(document.getElementById("np_budget").value)||0),np={id:uid(),name:nm.slice(0,40),pot:true,budget:nb};
    state.lists.push(np);save();closeSheet();ui.pot=np.id;render();window.scrollTo(0,0);return;
  }
  if(b.id==="pl_save"){var pl0=state.lists.filter(function(x){return x.id===b.dataset.pid;})[0];if(pl0){pl0.budget=Math.max(0,num(document.getElementById("pl_budget").value)||0);var prE=document.getElementById("pl_rate");if(prE&&num(prE.value)>0)state.eurRate=num(prE.value);save();}closeSheet();return;}
  if(b.id==="p_add"){var pi=document.getElementById("p_new"),pn=pi.value.trim();if(!pn)return;state.lists.push({id:uid(),name:pn.slice(0,40),pot:true});save();listsSheet();return;}
  if(b.id==="l_add"){var ni=document.getElementById("l_new"),nm=ni.value.trim();if(!nm)return;state.lists.push({id:uid(),name:nm.slice(0,40)});save();listsSheet();return;}
  if(b.id==="wl_go"){if(importWishlist(document.getElementById("wl_text").value))closeSheet();return;}
  if(b.id==="g_pick"){document.getElementById("g_file").click();return;}

    gdraft.name=document.getElementById("g_name").value.trim();
    var lk=cleanUrl(document.getElementById("g_url").value);

    else{gdraft.id=uid();state.goals.push(gdraft);}
    save();closeSheet();render();return;
  }
  if(b.id==="g_del"){if(confirm("Delete this item?")){state.goals=state.goals.filter(function(x){return x.id!==gdraft.id;});save();closeSheet();render();}return;}
});

/* ---------- wishlist import (JSON filled in by an AI) ---------- */
function parseItems(text){
  text=String(text||"").trim();
  var s=text.search(/[\[{]/),e=Math.max(text.lastIndexOf("}"),text.lastIndexOf("]"));
  if(s<0||e<s)return null;
  var d;try{d=JSON.parse(text.slice(s,e+1));}catch(x){return null;}
  return Array.isArray(d)?d:(d&&Array.isArray(d.items)?d.items:null);
}
function importWishlist(text){
  var arr=parseItems(text);
  if(!arr){alert("Could not read that JSON. Ask the AI to return only the JSON in the template format.");return false;}
  var added=0,dup=0,bad=0,noPrice=0,moved=0,fetchList=[];
  arr.forEach(function(it){
    if(!it||typeof it!=="object"){bad++;return;}
    var name=String(it.name||"").trim();if(!name){bad++;return;}
    var url=cleanUrl(it.url||it.link||"");if(url===null)url="";
    var ex=url?state.goals.filter(function(g){return g.url===url;})[0]:null;
    if(ex){var mv=listByName(it.list||it.category);if(mv){ex.listId=mv.id;moved++;}else dup++;return;}
    var cur=String(it.currency||"HUF").trim().toUpperCase();
    var price=0;
    if(cur==="HUF"||cur==="FT"){
      var digits=String(it.price==null?"":it.price).replace(/[^\d]/g,"");
      if(typeof it.price==="number"&&isFinite(it.price))price=Math.round(it.price);else if(digits)price=parseInt(digits,10);
    }
    var L=listByName(it.list||it.category)||((ui.gl!=="all"&&state.lists.filter(function(x){return x.id===ui.gl;})[0])||wishLists()[wishLists().length-1]);
    var g={id:uid(),name:name.slice(0,120),price:price>0?price:0,img:"",url:url,listId:L.id,done:false};
    if(!(price>0)){noPrice++;if(it.price!=null&&cur!=="HUF"&&cur!=="FT")g.hint="List price: "+it.price+" "+cur;}
    var im=String(it.image||it.image_url||it.photo||"").trim();
    if(/^https?:\/\//i.test(im)){g.img=im;fetchList.push(g);}
    state.goals.push(g);added++;
  });
  save();ui.tab="goals";render();window.scrollTo(0,0);
  // best effort: keep a small copy of each photo so it still shows if the shop removes it. One save at the end, no pop-ups.
  if(typeof fetch==="function"&&fetchList.length){
    Promise.all(fetchList.map(function(g){
      return fetch(g.img,{mode:"cors"}).then(function(r){return r.blob();}).then(function(b){
        if(!b||b.type.indexOf("image/")!==0)return false;
        return new Promise(function(res){resizeImage(b,function(data){g.img=data;res(true);},function(){res(false);});});
      }).catch(function(){return false;});
    })).then(function(r){if(r.some(Boolean)){save();render();}});
  }
  var msg="Added "+added+" item"+(added===1?"":"s")+" to your wishlist.";
  if(dup)msg+="\n"+dup+" skipped (same link already on your wishlist).";
  if(moved)msg+="\n"+moved+" existing item"+(moved===1?"":"s")+" moved to the list from your JSON.";
  if(bad)msg+="\n"+bad+" skipped (no name).";
  if(noPrice)msg+="\n"+noPrice+" need a price – open them and fill it in.";
  alert(msg);
  return true;
}

/* ---------- export / import ---------- */
function download(name,content,type){
  var blob=new Blob([content],{type:type+";charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}
function exportCsv(){
  var rows=[["date","type","category","amount_huf","eur","rate","place","note","planned"]];
  state.tx.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(t){lines(t).forEach(function(l){rows.push([t.date,t.type,l.cat,l.amount,t.eur||"",t.rate||"",t.place||"",t.note||"",isPlanned(t)?"yes":"no"]);});});
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  download("money-transactions-"+today()+".csv","\ufeff"+csv,"text/csv");
}
function restore(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.tx)||!Array.isArray(d.goals))throw new Error("bad");
      if(confirm("Replace current data with this backup ("+d.tx.length+" transactions, "+d.goals.length+" items)?")){state=d;normalize();save();render();}
    }catch(e){alert("That file is not a valid backup.");}
  };
  r.readAsText(file);
}

/* ---------- press-and-hold drag & drop (wishlist items within a list, plants in the garden) ---------- */
function reorderGoals(listId,ids){
  var slots=[],map={};
  state.goals.forEach(function(g,i){map[g.id]=g;if(g.listId===listId)slots.push(i);});
  if(slots.length!==ids.length)return;
  ids.forEach(function(id,k){if(map[id])state.goals[slots[k]]=map[id];});
}
function reorderPots(ids){
  var slots=[],map={};
  state.lists.forEach(function(l,i){map[l.id]=l;if(l.pot&&!l.done)slots.push(i);});
  if(slots.length!==ids.length)return;
  ids.forEach(function(id,k){if(map[id])state.lists[slots[k]]=map[id];});
}
(function(){
  var S=null,HOLD=450;
  function layout(){
    var dy=(S.cy+window.scrollY)-(S.sy+S.sScroll);
    var cen=S.tops[S.idx]+S.hs[S.idx]/2+dy,n=0;
    S.tops.forEach(function(t,i){if(i!==S.idx&&t+S.hs[i]/2<cen)n++;});
    S.to=n;
    S.els.forEach(function(el,i){
      if(i===S.idx){el.style.transform="translateY("+dy+"px) scale(1.02)";return;}
      var shift=0;
      if(i>S.idx&&i<=n)shift=-(S.hs[S.idx]+12);
      else if(i<S.idx&&i>=n)shift=S.hs[S.idx]+12;
      el.style.transform=shift?"translateY("+shift+"px)":"";
    });
  }
  function frame(){
    if(!S||!S.active)return;
    // only auto-scroll once the finger has actually been dragged toward an edge (not just held down near one)
    if(S.cy<90&&S.cy<S.ay-20)window.scrollBy(0,-12);else if(S.cy>window.innerHeight-150&&S.cy>S.ay+20)window.scrollBy(0,12);
    layout();
    S.raf=requestAnimationFrame(frame);
  }
  function activate(){
    S.timer=null;
    S.els=[].slice.call(app.querySelectorAll('[data-sort="'+S.group+'"]'));
    S.idx=S.els.indexOf(S.el);
    if(S.idx<0||S.els.length<2){S=null;return;}
    S.sScroll=window.scrollY;S.ay=S.cy;
    S.tops=S.els.map(function(e){return e.getBoundingClientRect().top+window.scrollY;});
    S.hs=S.els.map(function(e){return e.getBoundingClientRect().height;});
    S.to=S.idx;S.active=true;
    S.els.forEach(function(e,i){e.classList.add(i===S.idx?"dragging":"sorting");});
    try{if(navigator.vibrate)navigator.vibrate(12);}catch(x){}
    S.raf=requestAnimationFrame(frame);
  }
  function clean(){
    if(!S)return;
    if(S.timer)clearTimeout(S.timer);
    if(S.raf)cancelAnimationFrame(S.raf);
    (S.els||[]).forEach(function(e){e.classList.remove("dragging","sorting");e.style.transform="";});
  }
  app.addEventListener("pointerdown",function(e){
    if(S||(e.pointerType==="mouse"&&e.button!==0))return;
    var el=e.target.closest("[data-sort]");
    if(!el||e.target.closest("a,button,input,select,textarea"))return;
    S={el:el,group:el.dataset.sort,sx:e.clientX,sy:e.clientY,cy:e.clientY,pid:e.pointerId,active:false};
    S.timer=setTimeout(activate,HOLD);
  });
  document.addEventListener("pointermove",function(e){
    if(!S||e.pointerId!==S.pid)return;
    S.cy=e.clientY;
    if(!S.active&&(Math.abs(e.clientX-S.sx)>8||Math.abs(e.clientY-S.sy)>8)){clean();S=null;}
  });
  function finish(e,commit){
    if(!S||e.pointerId!==S.pid)return;
    var was=S.active,st=S;
    clean();S=null;
    if(!was)return;
    ui.noClick=Date.now()+500;
    if(commit&&st.to!==st.idx){
      var ids=st.els.map(function(x){return x.dataset.sid;}),mv=ids.splice(st.idx,1)[0];
      ids.splice(st.to,0,mv);
      if(st.group.indexOf("g:")===0)reorderGoals(st.group.slice(2),ids);else if(st.group==="pots")reorderPots(ids);
      save();
    }
    render();
  }
  document.addEventListener("pointerup",function(e){finish(e,true);});
  document.addEventListener("pointercancel",function(e){finish(e,false);});
  // once a drag has started, keep the page from scrolling under the finger
  document.addEventListener("touchmove",function(e){if(S&&S.active)e.preventDefault();},{passive:false});
  app.addEventListener("contextmenu",function(e){if(S)e.preventDefault();});
})();
